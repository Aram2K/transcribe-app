<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="180" fill="url(#bg)" rx="12"/>
  <rect width="820" height="180" fill="none" stroke="#1e293b" stroke-width="1" rx="12"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="60" x2="820" y2="60" stroke="#111" stroke-width="0.5"/>
  <line x1="0" y1="120" x2="820" y2="120" stroke="#111" stroke-width="0.5"/>

  <!-- Mic Icon -->
  <g transform="translate(54, 90)">
    <circle cx="0" cy="0" r="42" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
    <!-- Mic body -->
    <rect x="-9" y="-26" width="18" height="32" rx="9" fill="url(#accent)" filter="url(#glow)"/>
    <!-- Mic stand arc -->
    <path d="M-18 8 Q-18 28 0 28 Q18 28 18 8" stroke="#3b82f6" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Stand post -->
    <line x1="0" y1="28" x2="0" y2="38" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="38" x2="10" y2="38" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- App name -->
  <text x="120" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="46" font-weight="700" fill="white" letter-spacing="-1">Transcribe</text>

  <!-- Tagline -->
  <text x="121" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="16" fill="#64748b">Press a key &nbsp;·&nbsp; Speak &nbsp;·&nbsp; Text appears — anywhere on your screen</text>

  <!-- Badges row -->
  <!-- Windows badge -->
  <rect x="121" y="132" width="90" height="22" rx="4" fill="#1e293b"/>
  <text x="166" y="147" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">🪟 Windows</text>

  <!-- macOS badge -->
  <rect x="218" y="132" width="82" height="22" rx="4" fill="#1e293b"/>
  <text x="259" y="147" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">🍎 macOS</text>

  <!-- Free badge -->
  <rect x="307" y="132" width="68" height="22" rx="4" fill="#14532d" stroke="#22c55e" stroke-width="0.5"/>
  <text x="341" y="147" font-family="system-ui" font-size="11" fill="#22c55e" text-anchor="middle">✓ Free</text>

  <!-- Offline badge -->
  <rect x="382" y="132" width="74" height="22" rx="4" fill="#1e293b"/>
  <text x="419" y="147" font-family="system-ui" font-size="11" fill="#94a3b8" text-anchor="middle">⚡ Offline</text>

  <!-- Overlay mockup (right side) -->
  <g transform="translate(530, 40)">
    <rect x="0" y="0" width="260" height="90" rx="12" fill="#161616" stroke="#252525" stroke-width="1"/>
    <!-- Red recording dot -->
    <circle cx="22" cy="24" r="6" fill="#ff3b3b" opacity="0.9"/>
    <text x="36" y="29" font-family="system-ui" font-size="13" font-weight="600" fill="white">Recording</text>
    <text x="36" y="43" font-family="system-ui" font-size="9" fill="#444">Enter to stop  ·  Esc to cancel</text>
    <!-- Waveform -->
    <g transform="translate(14, 65)" opacity="0.9">
      <rect x="0"   y="-4"  width="4" height="8"  rx="2" fill="#3b82f6" opacity="0.4"/>
      <rect x="7"   y="-8"  width="4" height="16" rx="2" fill="#3b82f6" opacity="0.65"/>
      <rect x="14"  y="-6"  width="4" height="12" rx="2" fill="#3b82f6" opacity="0.55"/>
      <rect x="21"  y="-10" width="4" height="20" rx="2" fill="#3b82f6" opacity="0.85"/>
      <rect x="28"  y="-7"  width="4" height="14" rx="2" fill="#3b82f6" opacity="0.6"/>
      <rect x="35"  y="-3"  width="4" height="6"  rx="2" fill="#3b82f6" opacity="0.35"/>
      <rect x="42"  y="-9"  width="4" height="18" rx="2" fill="#3b82f6" opacity="0.75"/>
      <rect x="49"  y="-5"  width="4" height="10" rx="2" fill="#3b82f6" opacity="0.5"/>
      <rect x="56"  y="-11" width="4" height="22" rx="2" fill="#3b82f6" opacity="0.9"/>
      <rect x="63"  y="-7"  width="4" height="14" rx="2" fill="#3b82f6" opacity="0.6"/>
      <rect x="70"  y="-4"  width="4" height="8"  rx="2" fill="#3b82f6" opacity="0.4"/>
      <rect x="77"  y="-10" width="4" height="20" rx="2" fill="#3b82f6" opacity="0.8"/>
      <rect x="84"  y="-6"  width="4" height="12" rx="2" fill="#3b82f6" opacity="0.55"/>
      <rect x="91"  y="-8"  width="4" height="16" rx="2" fill="#3b82f6" opacity="0.7"/>
      <rect x="98"  y="-3"  width="4" height="6"  rx="2" fill="#3b82f6" opacity="0.35"/>
      <rect x="105" y="-9"  width="4" height="18" rx="2" fill="#3b82f6" opacity="0.75"/>
      <rect x="112" y="-5"  width="4" height="10" rx="2" fill="#3b82f6" opacity="0.5"/>
      <rect x="119" y="-11" width="4" height="22" rx="2" fill="#3b82f6" opacity="0.9"/>
      <rect x="126" y="-7"  width="4" height="14" rx="2" fill="#3b82f6" opacity="0.6"/>
      <rect x="133" y="-4"  width="4" height="8"  rx="2" fill="#3b82f6" opacity="0.4"/>
      <rect x="140" y="-8"  width="4" height="16" rx="2" fill="#3b82f6" opacity="0.65"/>
      <rect x="147" y="-10" width="4" height="20" rx="2" fill="#3b82f6" opacity="0.8"/>
      <rect x="154" y="-6"  width="4" height="12" rx="2" fill="#3b82f6" opacity="0.55"/>
      <rect x="161" y="-3"  width="4" height="6"  rx="2" fill="#3b82f6" opacity="0.35"/>
      <rect x="168" y="-9"  width="4" height="18" rx="2" fill="#3b82f6" opacity="0.75"/>
      <rect x="175" y="-7"  width="4" height="14" rx="2" fill="#3b82f6" opacity="0.6"/>
      <rect x="182" y="-5"  width="4" height="10" rx="2" fill="#3b82f6" opacity="0.5"/>
      <rect x="189" y="-11" width="4" height="22" rx="2" fill="#3b82f6" opacity="0.9"/>
      <rect x="196" y="-4"  width="4" height="8"  rx="2" fill="#3b82f6" opacity="0.4"/>
      <rect x="203" y="-8"  width="4" height="16" rx="2" fill="#3b82f6" opacity="0.65"/>
      <rect x="210" y="-6"  width="4" height="12" rx="2" fill="#3b82f6" opacity="0.55"/>
      <rect x="217" y="-10" width="4" height="20" rx="2" fill="#3b82f6" opacity="0.8"/>
      <rect x="224" y="-3"  width="4" height="6"  rx="2" fill="#3b82f6" opacity="0.35"/>
      <rect x="231" y="-7"  width="4" height="14" rx="2" fill="#3b82f6" opacity="0.6"/>
    </g>
  </g>
</svg>
